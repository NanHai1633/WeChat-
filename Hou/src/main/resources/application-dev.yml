# 本地开发环境：H2 文件库（数据存放在 ./data 目录），账号密码仅供本地使用
spring:
  datasource:
    url: jdbc:h2:file:./data/exam;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  jwt:
    secret: dev-only-secret-do-not-use-in-production-0123456789
  admins:
    - username: admin1
      password: Admin1@2026
    - username: admin2
      password: Admin2@2026
