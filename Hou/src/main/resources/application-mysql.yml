# 正式环境：所有敏感配置都从环境变量读取，缺失时启动失败
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: ${JWT_SECRET}
  admins:
    - username: admin1
      password: ${ADMIN1_PASSWORD}
    - username: admin2
      password: ${ADMIN2_PASSWORD}
